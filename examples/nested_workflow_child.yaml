# Child workflow for nested_workflow.yaml and spec_reference.yaml
#
# Parent workflows pass values via `input:` on the yaml step. Use them as
# {{ input.<key> }} in this file.

config:
  entrypoint: main

flows:
  main:
    steps:
      - name: format_notification
        uses: shell
        run: |
          echo "channel=#product-releases"
          echo "message={{ input.copy }}"
