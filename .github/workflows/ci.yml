name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov=telize --cov-report=term-missing

      - name: Build package
        run: uv build

  cli-smoke:
    runs-on: ubuntu-latest
    env:
      # Used by examples/env_config.yaml ({{ env.OLLAMA_HOST }} in models.*.api_url)
      OLLAMA_HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --all-groups
      - run: uv run telize --version
      - run: |
          for f in examples/*.yaml; do
            uv run telize -f "$f" --validate-only
          done
      - run: uv run telize -f tests/fixtures/minimal_workflow.yaml
