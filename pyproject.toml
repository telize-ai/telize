[project]
name = "telize"
version = "0.3.1"
description = "Automate with flows, not loose prompts. Chain LLM, shell, and code in one YAML pipeline."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Telize AI", email = "hello@telize.ai" }]
requires-python = ">=3.12"
keywords = ["agents", "ai", "llm", "workflow", "yaml", "low-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "croniter>=2.0",
    "httpx>=0.28",
    "openai>=1.0",
    "jinja2>=3.1",
    "pydantic>=2.10",
    "pyyaml>=6.0.2",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/telize-ai/telize"
Documentation = "https://github.com/telize-ai/telize#readme"
Repository = "https://github.com/telize-ai/telize"
Issues = "https://github.com/telize-ai/telize/issues"
Changelog = "https://github.com/telize-ai/telize/blob/main/CHANGELOG.md"

[project.scripts]
telize = "telize.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telize"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["telize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["telize"]
mypy_path = "src"

[tool.coverage.run]
source = ["telize"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
